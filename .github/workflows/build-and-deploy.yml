name: Deploy to Cloudflare Pages

on:
  # デフォルトブランチへのプッシュで実行
  push:
    branches: ["main"]

  # Actionsタブから手動実行も可能
  workflow_dispatch:

permissions:
  contents: read

# デプロイが並行して走らないようにする
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      # 画像・slides.json・rss.xml はリポジトリに含めず、ここで生成する
      - name: Convert slides
        uses: ./.github/actions/convert-slides

      # 変換後に配信用のPDFだけを圧縮する（変換は元の高画質PDFから行う）
      - name: Compress large PDFs
        run: |
          sudo apt-get install -y --no-install-recommends ghostscript
          for pdf in public/pdfs/*.pdf; do
            file_size=$(stat -c%s "$pdf")
            if [ "$file_size" -gt $((24 * 1024 * 1024)) ]; then
              echo "Compressing $pdf"
              gs -sDEVICE=pdfwrite -dCompatibilityLevel=1.4 -dPDFSETTINGS=/screen -dNOPAUSE -dQUIET -dBATCH -sOutputFile="${pdf%.pdf}_compressed.pdf" "$pdf"
              # 圧縮したファイルに置き換え
              mv "${pdf%.pdf}_compressed.pdf" "$pdf"
            fi
          done

      - name: Build Astro site
        run: npm run build
        env:
          VITE_GITHUB_ACTIONS: true
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_GITHUB_REPOSITORY_OWNER: ${{ github.event.repository.owner.login }}
          VITE_GITHUB_REPOSITORY: ${{ github.event.repository.name }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=slide-tubone24
