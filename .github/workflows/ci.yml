name: CI - Tests, Linting & Security

# main へのプッシュは build-and-deploy.yml で同じチェックを行うため、PR時のみ実行する
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチで新しいコミットが来たら古い実行をキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Check for vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Convert slides
        uses: ./.github/actions/convert-slides

      - name: Build project
        run: npm run build
        env:
          VITE_GITHUB_ACTIONS: true
          NODE_OPTIONS: --max-old-space-size=4096
